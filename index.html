<!DOCTYPE html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loughton Private GP | Coming Soon</title>
    <meta name="description" content="Loughton Private GP is launching soon." />
    <meta name="theme-color" content="#eee7de" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        background-color: #eee7de;
      }

      .banner {
        display: block;
        width: 100%;
        height: 100vh;
        height: 100dvh;
        object-fit: cover;
      }
    </style>
  </head>
  <body>
    <main>
      <picture>
        <source
          media="(min-width: 768px)"
          srcset="/coming-soon-desktop.webp"
        />
        <img
          class="banner"
          src="/coming-soon-mobile.webp"
          alt="Loughton Private GP, coming soon"
        />
      </picture>
    </main>
  </body>
</html>
