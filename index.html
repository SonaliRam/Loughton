<!DOCTYPE html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loughton Private GP | Coming Soon</title>
    <meta name="description" content="Loughton Private GP is launching soon." />
    <meta name="theme-color" content="#f7f2ec" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        background-color: #f7f2ec;
      }

      .banner {
        display: block;
        width: 100%;
        height: 100vh;
        height: 100dvh;
        object-fit: cover;
        object-position: left center;
      }

      @media (min-width: 768px) {
        .banner {
          object-position: center;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <img
        class="banner"
        src="banner_loughton-01.jpg.jpeg"
        alt="Loughton Private GP, coming soon"
      />
    </main>
  </body>
</html>
