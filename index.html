<!DOCTYPE html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loughton Private GP | Coming Soon</title>
    <meta name="description" content="Loughton Private GP is launching soon." />
    <meta name="theme-color" content="#f7f2ec" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="favicon-512.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        background-color: #f7f2ec;
      }

      /* portrait screens: fill the screen, keep the top so all the text stays visible */
      .banner {
        display: block;
        width: 100%;
        height: 100vh;
        height: 100dvh;
        object-fit: cover;
        object-position: left top;
      }

      /* landscape screens: fill the screen, keep the left side where the text is */
      @media (min-aspect-ratio: 1/1) {
        .banner {
          object-position: left center;
        }
      }

      /* very wide screens: show the whole banner so nothing is cut at the bottom */
      @media (min-aspect-ratio: 16/9) {
        .banner {
          object-fit: contain;
          object-position: right center;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <picture>
        <source
          media="(min-aspect-ratio: 1/1)"
          srcset="desktop-banner-2560.webp"
          width="2560"
          height="1440"
        />
        <img
          class="banner"
          src="mobile-banner-1080.webp"
          width="1080"
          height="1920"
          alt="Loughton Private GP, coming soon"
          fetchpriority="high"
        />
      </picture>
    </main>
  </body>
</html>
